/* Layout: label pinned ~10vh from the top; everything else centred in the remaining height.
   The 3D scene is a fixed full-screen layer behind the page, framed onto the stage slot, so flying parts never clip at a box edge.
   Single dark look by design: black velvet + gold. */

  --velvet:#0e0b12;

  --line:#2c2433;
  --gold:#e4b95b;
  --gold-hi:#f6dc96;
  --gold-deep:#8f6a22;
  --ink:#f4ecda;

  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;

  --fs-display:clamp(2.5rem,11vw,4.25rem);

[hidden]{display:none!important}
html,body{height:100%}

}
.scene{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:0;transition:opacity .4s var(--ease-out)}
.scene.gone{opacity:0}

.wrap{position:relative;z-index:1;max-width:560px;min-height:100%;box-sizing:border-box;margin:0 auto;padding-block:0 32px;display:flex;flex-direction:column;align-items:center;text-align:center}

const part = (parent, w, h, d, x, y, z, m) => { const k = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); k.position.set(x, y, z); parent.add(k); };
part(body, W_, TH, W_, 0, -H_/2 + TH/2, 0, boxMat);
part(body, W_, H_, TH, 0, 0,  W_/2 - TH/2, boxMat);  part(body, W_, H_, TH, 0, 0, -W_/2 + TH/2, boxMat);
part(body, TH, H_, W_ - 2*TH,  W_/2 - TH/2, 0, 0, boxMat); part(body, TH, H_, W_ - 2*TH, -W_/2 + TH/2, 0, 0, boxMat);
part(body, 16, H_ + .4, .6, 0, 0,  W_/2 + .3, ribbonMat); part(body, 16, H_ + .4, .6, 0, 0, -W_/2 - .3, ribbonMat);
part(body, .6, H_ + .4, 16,  W_/2 + .3, 0, 0, ribbonMat); part(body, .6, H_ + .4, 16, -W_/2 - .3, 0, 0, ribbonMat);
body.position.y = H_/2;
const lid = new THREE.Group(); box.add(lid);
part(lid, 108, 18, 108, 0, 0, 0, lidMat);
part(lid, 109, 18.4, 17, 0, 0, 0, lidRibMat); part(lid, 17, 18.4, 109, 0, 0, 0, lidRibMat);
const loopG = new THREE.TorusGeometry(13, 4.2, 12, 32);
[-1, 1].forEach(s => { const l = new THREE.Mesh(loopG, lidRibMat); l.position.set(s*12, 18, 0); l.rotation.z = s*.55; l.scale.set(1,.75,1); lid.add(l); });
const knot = new THREE.Mesh(new THREE.SphereGeometry(6, 16, 12), lidRibMat); knot.position.y = 12; lid.add(knot);
const LID_Y = H_ + 9; lid.position.y = LID_Y;

// trophy, hidden inside the closed box
const trophy = makeTrophy(env); scene.add(trophy);
const T_IN = { y: 22, s: .5 }, RISE = 35;
trophy.position.y = T_IN.y; trophy.scale.setScalar(T_IN.s);

// sparks
const N = 140, sp = new Float32Array(N*3), sv = [];
const sparkG = new THREE.BufferGeometry(); sparkG.setAttribute('position', new THREE.BufferAttribute(sp, 3));
const sparkM = new THREE.PointsMaterial({ color: 0xffd98a, size: 3.2, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
scene.add(new THREE.Points(sparkG, sparkM));
function burst(){
  for (let i = 0; i < N; i++){
    sp[i*3] = (Math.random()-.5)*60; sp[i*3+1] = 85; sp[i*3+2] = (Math.random()-.5)*60;
    const a = Math.random()*Math.PI*2, up = 90 + Math.random()*120, out = 30 + Math.random()*80;
    sv[i] = [Math.cos(a)*out, up, Math.sin(a)*out];
  }
  sparkG.attributes.position.needsUpdate = true; sparkM.opacity = 1;
}

/* ---------- motion ---------- */
const ease = { out: t => 1-Math.pow(1-t,3), inOut: t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2,
               back: t => { const c = 1.4; return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2); } };
const seg = (t, a, b) => Math.min(1, Math.max(0, (t-a)/(b-a)));
// press feedback: critically damped spring (damping 1, response .25 s)
const press = { x: 1, v: 0, to: 1 };
const K = Math.pow(2*Math.PI/.25, 2), C = 4*Math.PI/.25;
let state = 'idle', t0 = 0, spin = 0, last = performance.now(), running = true;

function frame(now){
  if (!running) return;
  const dt = Math.min(.05, (now-last)/1000); last = now;
  const t = (now - t0)/1000;
  fitCamera();

  press.v += (K*(press.to - press.x) - C*press.v)*dt; press.x += press.v*dt;

  if (state === 'idle'){
    const T = now/1000, ph = T % 4;
    box.rotation.y = Math.sin(T*.5)*.3 + .5;
    const wig = ph < .5 && !REDUCED ? Math.sin(ph*36)*.045*(1 - ph/.5) : 0;   // short nudge every 4 s
    box.rotation.z = wig; lid.position.y = LID_Y + Math.abs(wig)*40;
    box.scale.set(1 + (1-press.x)*.4, press.x, 1 + (1-press.x)*.4);           // squash on press
  } else {
    const tt = t * (REDUCED ? 2.2 : 1);
    box.scale.set(1,1,1);
    // lid: pops up, tumbles away up-left, shrinks and fades before it can reach a screen edge
    const l = ease.out(seg(tt, 0, 1.1));
    lid.position.set(-l*130, LID_Y + l*240, l*110);
    lid.rotation.set(-l*1.8, l*.7, l*2.6);
    lid.scale.setScalar(1 - .35*l);
    lidMat.opacity = lidRibMat.opacity = 1 - seg(tt, .35, .95);
    // body sinks and fades
    const b = ease.inOut(seg(tt, .55, 1.5));
    body.position.y = H_/2 - b*70; boxMat.opacity = ribbonMat.opacity = 1 - seg(tt, .6, 1.6);
    box.visible = tt < 1.7;
    if (state !== 'leaving'){
      const r = ease.out(seg(tt, .25, 1.3)), s = ease.back(seg(tt, .4, 1.6)), d = ease.inOut(seg(tt, 1.3, 2.2));
      trophy.position.y = T_IN.y + r*RISE - d*(T_IN.y + RISE) + (tt > 2.2 ? Math.sin((tt-2.2)*1.4)*2.5 : 0);
      trophy.scale.setScalar(T_IN.s + (1-T_IN.s)*s);
      spin += dt * (REDUCED ? .5 : (.9 + 5*(1 - seg(tt, .3, 2.4))));
      shadow.scale.setScalar(.7 + .3*d);
    }
  }
  if (state === 'leaving'){
    const v = ease.inOut(seg((now - tLeave)/1000, 0, .6));
    spin += dt*(1 + v*14);
    trophy.scale.setScalar(1 - v); trophy.position.y = v*30; shadow.scale.setScalar(1 - v);
  }
  trophy.rotation.y = spin;

  if (sparkM.opacity > 0){
    for (let i = 0; i < N; i++){ sv[i][1] -= 260*dt; sp[i*3] += sv[i][0]*dt; sp[i*3+1] += sv[i][1]*dt; sp[i*3+2] += sv[i][2]*dt; }
    sparkG.attributes.position.needsUpdate = true; sparkM.opacity = Math.max(0, sparkM.opacity - dt*.6);
  }
  R.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- interactions ---------- */
let moreTimer, revealTimer, tLeave = 0;
function openBox(){
  if (state !== 'idle') return;
  state = 'opening'; t0 = performance.now(); press.to = 1;
  stageEl.classList.add('opened'); stageEl.removeAttribute('role'); stageEl.setAttribute('aria-label', 'Trofej'); stageEl.tabIndex = -1;
  if (!REDUCED) setTimeout(burst, 120);
  revealTimer = setTimeout(() => {
    state = 'shown'; $('reveal').hidden = false;
    moreTimer = setTimeout(() => { $('more').hidden = false; $('more').focus({ preventScroll: true }); }, 1000);
  }, REDUCED ? 600 : 1500);
}
stageEl.addEventListener('pointerdown', () => { if (state === 'idle') press.to = .9; });
['pointerleave','pointercancel'].forEach(e => stageEl.addEventListener(e, () => { press.to = 1; }));
stageEl.addEventListener('click', openBox);
stageEl.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openBox(); } });

$('more').addEventListener('click', () => {
  state = 'leaving'; tLeave = performance.now();
  $('below').hidden = true;
  setTimeout(() => {
    canvas.classList.add('gone'); stageEl.hidden = true; showHall(); fitCamera();
    setTimeout(() => { running = false; }, 450);
  }, REDUCED ? 0 : 450);
});

$('again').addEventListener('click', () => {
  clearTimeout(moreTimer); clearTimeout(revealTimer); stopMini();
  $('hall').hidden = true; $('more').hidden = true; $('reveal').hidden = true; $('below').hidden = false;
  stageEl.hidden = false; stageEl.classList.remove('opened'); stageEl.setAttribute('role', 'button'); stageEl.setAttribute('aria-label', 'Otevřít krabici'); stageEl.tabIndex = 0;
  lid.position.set(0, LID_Y, 0); lid.rotation.set(0,0,0); lid.scale.setScalar(1);
  body.position.y = H_/2; boxMat.opacity = ribbonMat.opacity = lidMat.opacity = lidRibMat.opacity = 1; box.visible = true;
  trophy.position.y = T_IN.y; trophy.scale.setScalar(T_IN.s); shadow.scale.setScalar(1); sparkM.opacity = 0;
  state = 'idle'; spin = 0;
  canvas.classList.remove('gone');
  if (!running){ running = true; last = performance.now(); requestAnimationFrame(frame); }
  window.scrollTo({ top: 0 });
});

/* ---------- hall of fame: newest (current holder) on top ---------- */
let mini = null;
function showHall(){
  const ol = $('list'); ol.innerHTML = '';
  WINNERS.map((w, i) => ({ ...w, n: i + 1 })).reverse().forEach((w, i) => {
    const li = document.createElement('li'), now = i === 0;
    li.className = 'fade' + (now ? ' now' : ''); li.style.animationDelay = (Math.min(i, 8)*60) + 'ms';
    li.innerHTML = `<span class="n">${w.n}.</span><span class="who"></span><span class="d"></span>` +
      (now ? `<span class="holder"><canvas width="112" height="152" aria-label="Trofej"></canvas></span>` : '');
    li.querySelector('.who').textContent = w.name;
    li.querySelector('.d').textContent = w.date;
    ol.appendChild(li);
  });
  $('hall').hidden = false;
  ol.scrollTop = 0; edgeFades();
  const c = ol.querySelector('.holder canvas'); if (c) startMini(c);
}
function edgeFades(){
  const ol = $('list'), more = ol.scrollHeight - ol.clientHeight > 2;
  ol.classList.toggle('fade-top', more && ol.scrollTop > 2);
  ol.classList.toggle('fade-bottom', more && ol.scrollTop < ol.scrollHeight - ol.clientHeight - 2);
}
$('list').addEventListener('scroll', edgeFades, { passive: true });
addEventListener('resize', () => { if (!$('hall').hidden) edgeFades(); });

function startMini(c){
  const r = setupRenderer(c); r.setSize(56, 76, false);
  const s = new THREE.Scene(); addLights(s);
  const t = makeTrophy(makeEnv(r)); s.add(t);
  const cam = new THREE.PerspectiveCamera(30, 56/76, 1, 2000); cam.position.set(0, 110, 320); cam.lookAt(0, 74, 0);
  let on = true, a = 0, prev = performance.now();
  (function loop(n){ if (!on) return; a += (n-prev)/1000*(REDUCED ? .4 : 1.1); prev = n; t.rotation.y = a; r.render(s, cam); requestAnimationFrame(loop); })(prev);
  mini = { stop(){ on = false; r.dispose(); } };
}
function stopMini(){ if (mini){ mini.stop(); mini = null; } }
</script>

</body></html>
